
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Vault Creator</title>

<style>

*{
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#1c1c1c;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

h1,h2{
    margin-bottom:15px;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
}

input[type="text"],
input[type="url"]{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-bottom:10px;
}

.difficultyGroup{
    display:flex;
    gap:20px;
    margin-top:10px;
    margin-bottom:10px;
}

.difficultyGroup label{
    display:flex;
    align-items:center;
    gap:5px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#00b894;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#00a383;
}

textarea{
    width:100%;
    height:140px;
    border:none;
    border-radius:8px;
    padding:10px;
    resize:none;
}

.copyBtn{
    margin-top:10px;
}

#output{
    margin-top:20px;
}

</style>
</head>
<body>

<div class="container">

<div class="card">

<h1>Vault Creator</h1>

<label>Cover Image URL</label>

    id="coverImage">

    type="radio"

    value="easy"

</label>

<label>
<input
    type="radio"
    name="difficulty1"

</label>

<label>
<input
    type="radio"
    name="difficulty1"

Hard
</label>

</div>

<label>Password</label>
<input

    id="stage2Password">

<div class="difficultyGroup">

<label>
<input
    type="radio"
    name="difficulty2"
    value="easy"
    checked>
Easy
</label>

<label>
<input
    type="radio"
    name="difficulty2"
    value="medium">
Medium
</label>

<label>
<input
    type="radio"
    name="difficulty2"
    value="hard">
Hard
</label>

</div>

<!-- STAGE 3 -->

<h2>Stage 3</h2>

<label>Image URL</label>
<input
    type="url"
    id="stage3Image">

<label>Password</label>
<input
    type="text"
    id="stage3Password">

<div class="difficultyGroup">

<label>
<input
    type="radio"
    name="difficulty3"
    value="easy"
    checked>
Easy
</label>

<label>
<input
    type="radio"
    name="difficulty3"
    value="medium">
Medium
</label>

<label>
<input
    type="radio"
    name="difficulty3"
    value="hard">
Hard
</label>

</div>

<!-- STAGE 4 -->

<h2>Stage 4</h2>

<label>Image URL</label>
<input
    type="url"
    id="stage4Image">

<label>Password</label>
<input
    type="text"
    id="stage4Password">

<div class="difficultyGroup">

<label>
<input
    type="radio"
    name="difficulty4"
    value="easy"
    checked>
Easy
</label>

<label>
<input
    type="radio"
    name="difficulty4"
    value="medium">
Medium
</label>

<label>
<input
    type="radio"
    name="difficulty4"
    value="hard">
Hard
</label>

<!-- STAGE 5 -->

<h2>Stage 5</h2>

<label>Image URL</label>
<input
    type="url"
    id="stage5Image">

<label>Password</label>
<input

    id="stage5Password">

<div class="difficultyGroup">

<label>
<input

Easy

<h2>Bonus Image</h2>

<label>Bonus Image URL</label>
<input
    type="url"
    id="bonusImage">

<br>

<button onclick="generateLink()">
Generate Vault Link
</button>

<div id="output"></div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

<script>

function getDifficulty(number){

    return document.querySelector(
        `input[name="difficulty${number}"]:checked`
    ).value;

}

function generateLink(){

    const data = {

        cover:
            document.getElementById(
                "coverImage"
            ).value,

        stages:[

            {
                image:
                    document.getElementById(
                        "stage1Image"
                    ).value,

                password:
                    document
                    .getElementById(
                        "stage1Password"
                    )
                    .value
                    .trim()
                    .toUpperCase(),

                difficulty:
                    getDifficulty(1)
            },

            {
                image:
                    document.getElementById(
                        "stage2Image"
                    ).value,

                password:
                    document
                    .getElementById(
                        "stage2Password"
                    )
                    .value
                    .trim()
                    .toUpperCase(),

                difficulty:
                    getDifficulty(2)
            },

            {
                image:
                    document.getElementById(
                        "stage3Image"
                    ).value,

                password:
                    document
                    .getElementById(
                        "stage3Password"
                    )
                    .value
                    .trim()
                    .toUpperCase(),

                difficulty:
                    getDifficulty(3)
            },

            {
                image:
                    document.getElementById(
                        "stage4Image"
                    ).value,

                password:
                    document
                    .getElementById(
                        "stage4Password"
                    )
                    .value
                    .trim()
                    .toUpperCase(),

                difficulty:
                    getDifficulty(4)
            },

            {
                image:
                    document.getElementById(
                        "stage5Image"
                    ).value,

                password:
                    document
                    .getElementById(
                        "stage5Password"
                    )
                    .value
                    .trim()
                    .toUpperCase(),

                difficulty:
                    getDifficulty(5)
            }

        ],

        bonus:
            document.getElementById(
                "bonusImage"
            ).value

    };

    const compressed =

        LZString
        .compressToEncodedURIComponent(

            JSON.stringify(
                data
            )

        );

    const basePath =

        location.pathname
            .replace(
                "index.html",
                ""
            )
            .replace(
                /\/$/,
                ""
            );

    const url =

        location.origin +

        basePath +

        "/play.html#" +

        compressed;

    document.getElementById(
        "output"
    ).innerHTML =

    `
    <h2>Share Link</h2>

    <textarea id="generatedLink">${url}</textarea>

    <button
        class="copyBtn"
        onclick="copyLink()">

        Copy Link

    </button>
    `;

}

function copyLink(){

    const text =

        document.getElementById(
            "generatedLink"
        ).value;

    navigator.clipboard.writeText(
        text
    );

    alert(
        "Link copied!"
    );

}

</script>

</body>
</html>
