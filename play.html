<body>

<div class="container">

    <!-- LOADING -->

    <div
        id="loadingScreen"
        class="card center">

        Loading Vault...

    </div>

    <!-- COVER -->

    <div
        id="coverScreen"
        class="card center hidden">

        <h1>Exposure Vault</h1>

        <br>

        <img
            id="coverImage"
            class="coverImage">

        <br><br>

        <button
            class="primary"
            style="width:100%;padding:18px;font-size:22px;"
            onclick="startGame()">

            Begin Exposure

        </button>

    </div>

    <!-- GAME -->

    <div
        id="gameScreen"
        class="hidden">

        <div class="card">

            <h2
                id="stageTitle"
                class="stageTitle">

                Stage 1 / 5

            </h2>

            <div
                id="difficultyDisplay"
                class="difficulty">

                EASY

            </div>

            <img
                id="vaultImage"
                class="previewImage">

            <div
                id="passwordDisplay"
                class="passwordDisplay">

                ********

            </div>

            <div
                id="alarmContainer"
                class="alarmContainer">

            </div>

            <div
                id="codeDisplay"
                class="codeDisplay">

                ----

            </div>

            <div class="keypad">

                <button
                    class="numberBtn"
                    onclick="pressDigit('1')">1</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('2')">2</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('3')">3</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('4')">4</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('5')">5</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('6')">6</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('7')">7</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('8')">8</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('9')">9</button>

                <button
                    class="clearBtn"
                    onclick="clearCode()">

                    C

                </button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('0')">0</button>

                <button
                    class="hackBtn"
                    onclick="hack()">

                    HACK

                </button>

            </div>

            <div
                id="resultBox"
                class="resultBox">

            </div>

            <div class="history">

                <h3>
                    Access Log
                </h3>

                <div
                    id="historyList"
                    class="historyList">

                </div>

            </div>

        </div>

        <!-- GALLERY -->

        <div
            id="galleryCard"
            class="card hidden">

            <h2>
                Exposed Images
            </h2>

            <div
                id="gallery"
                class="gallery">

            </div>

        </div>

    </div>

    <!-- STAGE COMPLETE -->

    <div
        id="stageCompleteScreen"
        class="card center hidden">

        <h1>
            IMAGE EXPOSED
        </h1>

        <br>

        <img
            id="revealedImage"
            class="revealImage">

        <br><br>

        <button
            class="primary"
            style="width:100%;padding:18px;font-size:22px;"
            onclick="continueAfterReveal()">

            Continue

        </button>

    </div>

    <!-- LOCKDOWN -->

    <div
        id="resetScreen"
        class="card center hidden">

        <h1>
            SECURITY LOCKDOWN
        </h1>

        <br>

        <p>
            The vault has reset.
        </p>

        <br>

        <p>
            Password hidden again.
        </p>

        <br>

        <p>
            New access code generated.
        </p>

        <br><br>

        <button
            class="primary"
            style="width:100%;padding:18px;font-size:22px;"
            onclick="continueAfterReset()">

            Retry Stage

        </button>

    </div>

    <!-- VICTORY -->

    <div
        id="victoryScreen"
        class="card center hidden">

        <h1>
            BONUS VAULT UNLOCKED
        </h1>

        <br>

        <img
            id="bonusImage"
            class="revealImage">

        <br><br>

        <h2>
            Complete Collection
        </h2>

        <br>

        <div
            id="finalGallery"
            class="gallery">

        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="js/play.js"></script>

</body>
