<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Vault Cracker</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111;
    color:white;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.hidden{
    display:none;
}

.card{
    background:#1c1c1c;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.center{
    text-align:center;
}

button{
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.primary{
    background:#00b894;
    color:white;
}

.primary:hover{
    background:#00a383;
}

img{
    width:100%;
    border-radius:10px;
}

.previewImage{
    height:350px;
    object-fit:cover;
    filter:blur(18px);
}

.stageTitle{
    text-align:center;
    margin-bottom:10px;
}

.difficulty{
    text-align:center;
    color:#999;
    margin-bottom:20px;
    text-transform:uppercase;
}

.passwordBox{
    text-align:center;
    font-size:42px;
    font-weight:bold;
    letter-spacing:8px;
    margin-top:20px;
    word-break:break-word;
}

.stats{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px,1fr)
        );

    gap:15px;
    margin-top:20px;
}

.stat{
    background:#222;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.statTitle{
    color:#999;
    font-size:14px;
    margin-bottom:8px;
}

.statValue{
    font-size:28px;
    font-weight:bold;
}

#alarmsDisplay{
    display:flex;
    justify-content:center;
    gap:8px;
}

.alarm{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#ff2b2b;

    box-shadow:
        0 0 6px #ff2b2b,
        0 0 12px #ff2b2b,
        0 0 24px #ff2b2b;
}

/* ==========================
   PROGRESS BAR
========================== */

.hackBar{
    margin-top:20px;
    height:14px;
    background:#222;
    border-radius:8px;
    overflow:hidden;
}

#hackProgress{
    width:0%;
    height:100%;
    background:#00b894;
}

/* ==========================
   RESULTS
========================== */

.resultBox{
    text-align:center;
    margin-top:20px;
    min-height:120px;
    font-size:20px;
    line-height:1.6;
    white-space:pre-line;
}

/* ==========================
   CODE INPUT
========================== */

.codeInput{
    margin-top:25px;
}

#codeDisplay{

    width:100%;
    height:70px;

    background:#000;
    color:#00ff66;

    border:2px solid #333;
    border-radius:10px;

    text-align:center;
    font-size:38px;
    font-weight:bold;
    letter-spacing:12px;
}

.numpad{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-top:15px;
}

.numBtn{

    height:70px;

    background:#333;
    color:white;

    font-size:28px;
    font-weight:bold;

    border-radius:10px;
}

.numBtn:hover{
    background:#444;
}

.actionRow{

    display:grid;

    grid-template-columns:
        1fr 2fr;

    gap:10px;

    margin-top:10px;
}

.clearBtn{

    height:70px;

    background:#555;
    color:white;

    font-size:20px;
}

.hackBtn{

    height:70px;

    background:#00b894;
    color:white;

    font-size:24px;
    font-weight:bold;
}

/* ==========================
   GALLERY
========================== */

.gallery{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(140px,1fr)
        );

    gap:10px;

    margin-top:20px;
}

.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.revealImage{
    max-height:700px;
    object-fit:contain;
}

</style>
</head>
<body>

<div class="container">

<!-- LOADING -->

<div
    id="loadingScreen"
    class="card center">

    Loading Vault...

</div>

<!-- COVER -->

<div
    id="coverScreen"
    class="card center hidden">

    <h1>Vault Cracker</h1>

    <br>

    <img id="coverImage">

    <br><br>

    <button
        class="primary"
        style="width:100%;padding:18px;font-size:22px;"
        onclick="startGame()">

        Begin Hack

    </button>

</div>

<!-- GAME -->

<div
    id="gameScreen"
    class="hidden">

    <div class="card">

        <h2
            id="stageTitle"
            class="stageTitle">

            Stage 1

        </h2>

        <div
            id="difficultyDisplay"
            class="difficulty">

            EASY

        </div>

        <img
            id="vaultImage"
            class="previewImage">

        <div
            id="passwordDisplay"
            class="passwordBox">

            ********

        </div>

        <div class="stats">

            <div class="stat">

                <div class="statTitle">
                    Attempts
                </div>

                <div
                    id="attemptsDisplay"
                    class="statValue">

                    10

                </div>

            </div>

            <div class="stat">

                <div class="statTitle">
                    Alarms
                </div>

                <div
                    id="alarmsDisplay"
                    class="statValue">

                </div>

            </div>

        </div>

        <div class="hackBar">

            <div id="hackProgress"></div>

        </div>

        <div
            id="resultBox"
            class="resultBox">

        </div>

        <!-- CODE ENTRY -->

        <div class="codeInput">

            <input
                id="codeDisplay"
                type="text"
                value=""
                readonly>

            <div class="numpad">

                <button class="numBtn" onclick="addDigit('1')">1</button>
                <button class="numBtn" onclick="addDigit('2')">2</button>
                <button class="numBtn" onclick="addDigit('3')">3</button>

                <button class="numBtn" onclick="addDigit('4')">4</button>
                <button class="numBtn" onclick="addDigit('5')">5</button>
                <button class="numBtn" onclick="addDigit('6')">6</button>

                <button class="numBtn" onclick="addDigit('7')">7</button>
                <button class="numBtn" onclick="addDigit('8')">8</button>
                <button class="numBtn" onclick="addDigit('9')">9</button>

                <button class="numBtn" onclick="backspaceDigit()">⌫</button>
                <button class="numBtn" onclick="addDigit('0')">0</button>
                <button class="numBtn" onclick="clearCode()">C</button>

            </div>

            <div class="actionRow">

                <button
                    class="clearBtn"
                    onclick="clearCode()">

                    CLEAR

                </button>

                <button
                    id="hackButton"
                    class="hackBtn"
                    onclick="hack()">

                    HACK

                </button>

            </div>

        </div>

    </div>

    <!-- GALLERY -->

    <div
        id="galleryCard"
        class="card hidden">

        <h2>
            Vault Contents
        </h2>

        <div
            id="gallery"
            class="gallery">

        </div>

    </div>

</div>

<!-- STAGE COMPLETE -->

<div
    id="stageCompleteScreen"
    class="card center hidden">

    <h1>
        ACCESS GRANTED
    </h1>

    <br>

    <img
        id="revealedImage"
        class="revealImage">

    <br><br>

    <button
        class="primary"
        style="width:100%;padding:18px;font-size:22px;"
        onclick="continueAfterReveal()">

        Continue

    </button>

</div>

<!-- RESET -->

<div
    id="resetScreen"
    class="card center hidden">

    <h1>
        SECURITY LOCKOUT
    </h1>

    <br>

    <p>
        Too many alarms were triggered.
    </p>

    <br>

    <p>
        The password has been reset.
    </p>

    <br>

    <button
        class="primary"
        style="width:100%;padding:18px;font-size:22px;"
        onclick="continueAfterReset()">

        Try Again

    </button>

</div>

<!-- VICTORY -->

<div
    id="victoryScreen"
    class="card center hidden">

    <h1>
        VAULT OPENED
    </h1>

    <br>

    <h2>
        Bonus Reward
    </h2>

    <br>

    <img
        id="bonusImage"
        class="revealImage">

    <br><br>

    <h2>
        Complete Collection
    </h2>

    <br>

    <div
        id="finalGallery"
        class="gallery">

    </div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="js/play.js"></script>

</body>
</html>
