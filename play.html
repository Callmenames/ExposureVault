<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Vault Cracker</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111;
    color:white;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.hidden{
    display:none;
}

.card{
    background:#1c1c1c;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.center{
    text-align:center;
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:22px;
    font-weight:bold;
}

.primary{
    background:#00b894;
    color:white;
}

.primary:hover{
    background:#00a383;
}

img{
    width:100%;
    border-radius:10px;
}

.previewImage{
    height:350px;
    object-fit:cover;
    filter:blur(18px);
}

.passwordBox{
    text-align:center;
    font-size:42px;
    letter-spacing:8px;
    font-weight:bold;
    word-break:break-word;
    margin-top:20px;
}

.stats{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px,1fr)
        );
    gap:15px;
    margin-top:20px;
}

.stat{
    background:#222;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.statTitle{
    color:#999;
    font-size:14px;
    margin-bottom:8px;
}

.statValue{
    font-size:26px;
    font-weight:bold;
}

.resultBox{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-top:20px;
    min-height:40px;
}

.gallery{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(140px,1fr)
        );

    gap:10px;
    margin-top:20px;
}

.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.revealImage{
    max-height:600px;
    object-fit:contain;
}

.stageTitle{
    text-align:center;
    margin-bottom:15px;
}

.difficulty{
    text-align:center;
    color:#aaa;
    margin-bottom:15px;
    text-transform:uppercase;
}

</style>
</head>
<body>

<div class="container">

<!-- LOADING -->

<div
    id="loadingScreen"
    class="card center">

    Loading Vault...

</div>

<!-- COVER -->

<div
    id="coverScreen"
    class="card center hidden">

    <h1>Vault Cracker</h1>

    <br>

    <img
        id="coverImage">

    <br><br>

    <button
        class="primary"
        onclick="startGame()">

        Begin Hack

    </button>

</div>

<!-- GAME -->

<div
    id="gameScreen"
    class="hidden">

    <div class="card">

        <h2
            id="stageTitle"
            class="stageTitle">

            Stage 1

        </h2>

        <div
            id="difficultyDisplay"
            class="difficulty">

            EASY

        </div>

        <img
            id="vaultImage"
            class="previewImage">

        <div
            id="passwordDisplay"
            class="passwordBox">

            ********

        </div>

        <div class="stats">

            <div class="stat">

                <div class="statTitle">
                    Attempts
                </div>

                <div
                    id="attemptsDisplay"
                    class="statValue">

                    10

                </div>

            </div>

            <div class="stat">

                <div class="statTitle">
                    Alarms
                </div>

                <div
                    id="alarmsDisplay"
                    class="statValue">

                    ❤❤❤

                </div>

            </div>

        </div>

        <div
            id="resultBox"
            class="resultBox">

        </div>

        <button
            id="hackButton"
            class="primary"
            onclick="hack()">

            HACK

        </button>

    </div>

    <!-- GALLERY -->

    <div
        id="galleryCard"
        class="card hidden">

        <h2>
            Vault Contents
        </h2>

        <div
            id="gallery"
            class="gallery">

        </div>

    </div>

</div>

<!-- STAGE COMPLETE -->

<div
    id="stageCompleteScreen"
    class="card center hidden">

    <h1>
        ACCESS GRANTED
    </h1>

    <br>

    <img
        id="revealedImage"
        class="revealImage">

    <br><br>

    <button
        class="primary"
        onclick="continueAfterReveal()">

        Continue

    </button>

</div>

<!-- RESET -->

<div
    id="resetScreen"
    class="card center hidden">

    <h1>
        SECURITY LOCKOUT
    </h1>

    <br>

    <p>
        Too many alarms were triggered.
    </p>

    <br>

    <p>
        The password has been reset.
    </p>

    <br>

    <button
        class="primary"
        onclick="continueAfterReset()">

        Try Again

    </button>

</div>

<!-- VICTORY -->

<div
    id="victoryScreen"
    class="card center hidden">

    <h1>
        VAULT OPENED
    </h1>

    <br>

    <h2>
        Bonus Reward
    </h2>

    <br>

    <img
        id="bonusImage"
        class="revealImage">

    <br><br>

    <h2>
        Complete Collection
    </h2>

    <br>

    <div
        id="finalGallery"
        class="gallery">

    </div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

<script src="js/play.js"></script>

</body>
</html>
