<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exposure Vault</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111;
    color:#fff;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.hidden{
    display:none !important;
}

.card{
    background:#1c1c1c;
    border-radius:12px;
    padding:14px;
    margin-bottom:20px;
}

.center{
    text-align:center;
}

img{
    width:100%;
    border-radius:10px;
}

button{
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.primary{
    background:#00b894;
    color:white;
}

.primary:hover{
    background:#00a383;
}

.coverImage{
    max-height:650px;
    object-fit:cover;
}

.previewImage{
    height:400px;
    object-fit:cover;
    transition:filter .4s ease;
}

.revealImage{
    max-height:700px;
    object-fit:contain;
}

.stageTitle{
    text-align:center;
    margin-bottom:10px;
}

.difficulty{
    text-align:center;
    color:#999;
    text-transform:uppercase;
    margin-bottom:20px;
}

.passwordDisplay{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    letter-spacing:8px;
    margin-top:12px;
    word-break:break-word;
}

.alarmContainer{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:20px;
}

.alarm{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#ff3b3b;

    box-shadow:
        0 0 8px #ff3b3b,
        0 0 16px #ff3b3b,
        0 0 24px #ff3b3b;
}

.codeDisplay{
    margin-top:25px;
    text-align:center;
    font-size:42px;
    font-weight:bold;
    letter-spacing:12px;
    min-height:55px;
}

.progressBar{
    margin-top:20px;
    height:10px;
    background:#333;
    border-radius:999px;
    overflow:hidden;
}

.progressFill{
    height:100%;
    width:0%;
    background:#00b894;
}

    #backgroundImage{
    position:fixed;
    inset:0;
    z-index:-2;

    background-size:cover;
    background-position:center;

    filter:blur(40px);
    transform:scale(1.15);

    opacity:.25;
}

#backgroundImage::after{
    content:"";
    position:absolute;
    inset:0;
    background:#000;
    opacity:.65;
}

#statusBar{
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
    margin-bottom:15px;
}

.statusDecrypt{
    background:#00b894;
    color:white;
}

.statusCaution{
    background:#e74c3c;
    color:white;
}

.keypad{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.keypad button{
    padding:12px;
    font-size:20px;
}

.numberBtn{
    background:#333;
    color:white;
}

.numberBtn:hover{
    background:#444;
}

.clearBtn{
    background:#555;
    color:white;
}

.hackBtn{
    background:#00b894;
    color:white;
}

.resultBox{
    margin-top:20px;
    min-height:40px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.history{
    margin-top:25px;
}

.history h3{
    margin-bottom:10px;
}

.historyList{
    background:#222;
    border-radius:10px;
    padding:15px;
    max-height:250px;
    overflow-y:auto;
}

.historyEntry{
    padding:10px;
    margin:6px 0;
    background:#222;
    border-radius:6px;
    font-family:monospace;
    font-size:20px;
}

.gallery{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(140px,1fr)
        );

    gap:10px;
    margin-top:20px;
}

.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.hints{
    display:flex;
    gap:6px;
    justify-content:center;
}

.hint{
    width:14px;
    height:14px;
    border-radius:50%;
}

.green{
    color:#2ecc71;
}

.yellow{
    color:#f1c40f;
}

.grey{
    color:#666;
}

</style>
</head>
<body>

<div class="container">

    <!-- LOADING -->

    <div
        id="loadingScreen"
        class="card center">

        Loading Vault...

    </div>

    <!-- COVER -->

    <div
        id="coverScreen"
        class="card center hidden">

        <h1>Exposure Vault</h1>

        <br>

        <img
            id="coverImage"
            class="coverImage">

        <br><br>

        <button
            class="primary"
            style="
                width:100%;
                padding:18px;
                font-size:22px;
            "
            onclick="startGame()">

            Begin Exposure

        </button>

    </div>

    <!-- GAME -->

    <div
        id="gameScreen"
        class="hidden">
        <div id="backgroundImage"></div>
        <div class="card">

            <h2
                id="stageTitle"
                class="stageTitle">

                Stage 1 / 5

            </h2>

            <div
                id="difficultyDisplay"
                class="difficulty">

                EASY

            </div>

            <div
                id="statusBar"
                class="hidden">
            </div>

            <div
                id="passwordDisplay"
                class="passwordDisplay">

                ********

            </div>

            <div
                id="alarmContainer"
                class="alarmContainer">

            </div>

            <div
                id="codeDisplay"
                class="codeDisplay">

                ----

            </div>

            <div
                id="hintRow"
                class="hints">
            </div>

            <div class="progressBar">

                <div
                    id="progressFill"
                    class="progressFill">

                </div>

            </div>

            <div class="keypad">

                <button
                    class="numberBtn"
                    onclick="pressDigit('1')">1</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('2')">2</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('3')">3</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('4')">4</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('5')">5</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('6')">6</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('7')">7</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('8')">8</button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('9')">9</button>

                <button
                    class="clearBtn"
                    onclick="clearCode()">

                    C

                </button>

                <button
                    class="numberBtn"
                    onclick="pressDigit('0')">0</button>

                <button
                    id="hackButton"
                    class="hackBtn"
                    onclick="hack()">

                    HACK

                </button>

            </div>

            <div
                id="resultBox"
                class="resultBox">

            </div>

            <div class="history">

                <h3>
                    Access Log
                </h3>

                <div
                    id="historyList"
                    class="historyList">

                </div>

            </div>

        </div>

        <!-- GALLERY -->

        <div
            id="galleryCard"
            class="card hidden">

            <h2>
                Exposed Images
            </h2>

            <div
                id="gallery"
                class="gallery">

            </div>

        </div>

    </div>

    <!-- STAGE COMPLETE -->

    <div
        id="stageCompleteScreen"
        class="card center hidden">

        <h1>
            IMAGE EXPOSED
        </h1>

        <br>

        <img
            id="revealedImage"
            class="revealImage">

        <br><br>

        <button
            class="primary"
            style="
                width:100%;
                padding:18px;
                font-size:22px;
            "
            onclick="continueAfterReveal()">

            Continue

        </button>

    </div>

    <!-- LOCKDOWN -->

    <div
        id="resetScreen"
        class="card center hidden">

        <h1>
            SECURITY LOCKDOWN
        </h1>

        <br>

        <p>
            The vault has been reset.
        </p>

        <br>

        <p>
            Password hidden again.
        </p>

        <br>

        <p>
            New access code generated.
        </p>

        <br><br>

        <button
            class="primary"
            style="
                width:100%;
                padding:18px;
                font-size:22px;
            "
            onclick="continueAfterReset()">

            Retry Stage

        </button>

    </div>

    <!-- VICTORY -->

    <div
        id="victoryScreen"
        class="card center hidden">

        <h1>
            BONUS VAULT UNLOCKED
        </h1>

        <br>

        <img
            id="bonusImage"
            class="revealImage">

        <br><br>

        <h2>
            Complete Collection
        </h2>

        <br>

        <div
            id="finalGallery"
            class="gallery">

        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="js/play.js"></script>

</body>
</html>
