<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Vault Cracker</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111;
    color:white;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.hidden{
    display:none;
}

.card{
    background:#1c1c1c;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.center{
    text-align:center;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
    margin-top:10px;
}

.primary{
    background:#00b894;
    color:white;
}

.primary:hover{
    background:#00a383;
}

.secondary{
    background:#444;
    color:white;
}

.secondary:hover{
    background:#555;
}

img{
    max-width:100%;
    border-radius:10px;
}

.statRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:12px 0;
    font-size:20px;
}

.progressBar{
    width:100%;
    height:24px;
    background:#333;
    border-radius:999px;
    overflow:hidden;
    margin-top:10px;
}

.progressFill{
    height:100%;
    width:100%;
    background:#00b894;
    transition:width .3s;
}

#wheelWrapper{
    width:340px;
    height:340px;
    margin:20px auto;
    position:relative;
}

#wheelPointer{
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    font-size:40px;
}

#wheel{
    width:340px;
    height:340px;
    border-radius:50%;
    border:8px solid #444;
    transition:
        transform 4s
        cubic-bezier(
            .17,
            .67,
            .13,
            .99
        );
}

.resultBox{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
    text-align:center;
    min-height:30px;
}

.gallery{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(140px,1fr)
        );
    gap:10px;
}

.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.bigImage{
    max-height:70vh;
    width:auto;
    max-width:100%;
}

</style>
</head>
<body>

<div class="container">

<!-- Loading -->

<div
    id="loadingScreen"
    class="card center">

    Loading Vault...

</div>

<!-- Cover -->

<div
    id="coverScreen"
    class="card center hidden">

    <h1>Vault Cracker</h1>

    <br>

    <img id="coverImage">

    <br><br>

    <button
        class="primary"
        onclick="startGame()">

        Start Cracking

    </button>

</div>

<!-- Main Game -->

<div
    id="gameScreen"
    class="hidden">

    <div class="card">

        <h2 id="stageTitle">

            Stage 1 / 5

        </h2>

        <div class="statRow">

            <span>
                Pins Remaining
            </span>

            <span id="pinsRemaining">
                0
            </span>

        </div>

        <div class="progressBar">

            <div
                id="pinProgress"
                class="progressFill">

            </div>

        </div>

        <div class="statRow">

            <span>
                Lives
            </span>

            <span id="livesDisplay">
                ❤❤❤
            </span>

        </div>

        <div class="statRow">

            <span>
                Shield
            </span>

            <span id="shieldDisplay">
                None
            </span>

        </div>

        <div class="statRow">

            <span>
                Spin Timer
            </span>

            <span id="timerDisplay">
                0 / 0
            </span>

        </div>

    </div>

    <!-- Wheel -->

    <div class="card center">

        <div id="wheelWrapper">

            <div id="wheelPointer">
                ▼
            </div>

            <canvas
                id="wheel"
                width="340"
                height="340">
            </canvas>

        </div>

        <button
            id="spinButton"
            class="primary"
            onclick="spinWheel()">

            Spin Wheel

        </button>

        <div
            id="resultBox"
            class="resultBox">

        </div>

    </div>

    <!-- Gallery -->

    <div
        id="galleryCard"
        class="card hidden">

        <h2>
            Unlocked Images
        </h2>

        <br>

        <div
            id="gallery"
            class="gallery">

        </div>

    </div>

</div>

<!-- Stage Complete -->

<div
    id="stageCompleteScreen"
    class="card center hidden">

    <h1>
        Vault Cracked
    </h1>

    <br>

    <img
        id="revealedImage"
        class="bigImage">

    <br><br>

    <button
        class="primary"
        onclick="continueAfterReveal()">

        Continue

    </button>

</div>

<!-- Stage Reset -->

<div
    id="resetScreen"
    class="card center hidden">

    <h1>
        Security Reset
    </h1>

    <br>

    <p>

        You lost all lives.

    </p>

    <br>

    <p>

        This vault layer has reset.

    </p>

    <br>

    <button
        class="primary"
        onclick="continueAfterReset()">

        Try Again

    </button>

</div>

<!-- Victory -->

<div
    id="victoryScreen"
    class="card center hidden">

    <h1>
        Vault Complete
    </h1>

    <br>

    <h2>
        Bonus Reward
    </h2>

    <br>

    <img id="bonusImage">

    <br><br>

    <h2>
        Complete Collection
    </h2>

    <br>

    <div
        id="finalGallery"
        class="gallery">

    </div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

<script src="js/play.js"></script>

</body>
</html>
