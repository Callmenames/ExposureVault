<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Exposure Vault</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

/* BACKGROUND */

#backgroundImage{
    position:fixed;
    inset:0;

    background-size:cover;
    background-position:center;

    filter:blur(40px);

    transform:scale(1.15);

    opacity:.45;

    z-index:-2;
}

#overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.65);

    z-index:-1;
}

/* LAYOUT */

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.panel{
    background:rgba(20,20,20,.92);

    backdrop-filter:blur(10px);

    border-radius:16px;

    padding:20px;

    border:1px solid
        rgba(255,255,255,.08);
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

#difficultyBadge{
    background:#222;
    border-radius:20px;
    padding:8px 14px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

/* TARGET IMAGE */

#targetFrame{
    width:100%;
    height:220px;

    border-radius:12px;

    overflow:hidden;

    margin-bottom:20px;

    border:2px solid
        rgba(255,255,255,.1);

    background:#000;
}

#targetImage{
    width:100%;
    height:100%;

    object-fit:cover;

    filter:blur(40px);

    transition:
        filter .4s ease;
}

/* ALARMS */

#alarmContainer{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
}

.alarm{
    width:18px;
    height:18px;
    border-radius:50%;

    background:#ff3b30;

    box-shadow:
        0 0 10px
        rgba(255,59,48,.6);
}

/* PASSWORD */

#passwordDisplay{
    margin-top:15px;

    text-align:center;

    font-size:34px;

    font-weight:bold;

    letter-spacing:10px;

    word-break:break-all;
}

/* CODE */

#codeDisplay{
    margin-top:20px;

    background:#000;

    border-radius:12px;

    padding:15px;

    text-align:center;

    font-size:36px;

    letter-spacing:10px;

    min-height:75px;
}

/* NUMPAD */

.numpad{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-top:20px;
}

.numpad button{
    height:65px;

    border:none;

    border-radius:10px;

    background:#222;

    color:white;

    font-size:24px;

    cursor:pointer;
}

.numpad button:hover{
    background:#333;
}

/* ACTIONS */

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.actions button{
    flex:1;

    height:60px;

    border:none;

    border-radius:10px;

    color:white;

    font-size:18px;

    cursor:pointer;
}

#hackBtn{
    background:#00b894;
}

#clearBtn{
    background:#636e72;
}

/* HINTS */

#hintLights{
    display:flex;

    justify-content:center;

    gap:12px;

    margin-top:20px;

    min-height:22px;
}

.hint{
    width:22px;
    height:22px;
    border-radius:50%;
}

.green{
    background:#00b894;
}

.yellow{
    background:#f1c40f;
}

.grey{
    background:#636e72;
}

/* RESULT */

#wheelResult{
    text-align:center;

    font-size:24px;

    font-weight:bold;

    margin-top:20px;

    min-height:40px;
}

/* LOG */

#log{
    margin-top:20px;

    background:#111;

    border-radius:12px;

    padding:15px;

    height:180px;

    overflow-y:auto;
}

.logEntry{
    margin-bottom:8px;
}

/* MODAL */

#modal{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.85);

    z-index:1000;
}

.modalContent{
    width:100%;
    max-width:500px;

    background:#111;

    border-radius:16px;

    padding:30px;

    text-align:center;
}

.modalContent h2{
    margin-bottom:15px;
}

.modalContent button{
    width:100%;

    height:50px;

    border:none;

    border-radius:10px;

    background:#00b894;

    color:white;

    cursor:pointer;

    margin-top:20px;
}

/* HACKING OVERLAY */

#hackOverlay{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.9);

    z-index:2000;
}

.hackBox{
    width:90%;
    max-width:500px;
}

#hackStatus{
    text-align:center;

    font-size:28px;

    letter-spacing:4px;

    margin-bottom:20px;
}

#progressOuter{
    height:24px;

    background:#222;

    border-radius:12px;

    overflow:hidden;
}

#progressInner{
    width:0%;

    height:100%;

    background:#00b894;
}

</style>
</head>
<body>

<div id="backgroundImage"></div>
<div id="overlay"></div>

<div class="container">

    <div class="panel">

        <div class="header">

            <div id="stageLabel">
                Stage 1 / 5
            </div>

            <div id="difficultyBadge">
                Easy
            </div>

        </div>

        <h1>EXPOSURE VAULT</h1>

        <div id="targetFrame">

            <img
                id="targetImage"
                src=""
                alt="Target">

        </div>

        <h3>Security Alarms</h3>

        <div id="alarmContainer"></div>

        <h3
            style="margin-top:20px;">
            Password
        </h3>

        <div id="passwordDisplay">
            ********
        </div>

        <div id="codeDisplay">
            ----
        </div>

        <div class="numpad">

            <button onclick="addDigit('1')">1</button>
            <button onclick="addDigit('2')">2</button>
            <button onclick="addDigit('3')">3</button>

            <button onclick="addDigit('4')">4</button>
            <button onclick="addDigit('5')">5</button>
            <button onclick="addDigit('6')">6</button>

            <button onclick="addDigit('7')">7</button>
            <button onclick="addDigit('8')">8</button>
            <button onclick="addDigit('9')">9</button>

            <button onclick="clearCode()">⌫</button>
            <button onclick="addDigit('0')">0</button>
            <button onclick="resetCode()">C</button>

        </div>

        <div class="actions">

            <button
                id="hackBtn"
                onclick="attemptHack()">
                HACK
            </button>

            <button
                id="clearBtn"
                onclick="resetCode()">
                CLEAR
            </button>

        </div>

        <div id="hintLights"></div>

        <div id="wheelResult">
            READY
        </div>

        <div id="log"></div>

    </div>

</div>

<!-- MODAL -->

<div id="modal">

    <div class="modalContent">

        <h2 id="modalTitle"></h2>

        <p id="modalMessage"></p>

        <button onclick="closeModal()">
            Continue
        </button>

    </div>

</div>

<!-- HACKING SCREEN -->

<div id="hackOverlay">

    <div class="hackBox">

        <div id="hackStatus">
            HACKING...
        </div>

        <div id="progressOuter">

            <div id="progressInner"></div>

        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="play.js"></script>

</body>
</html>
